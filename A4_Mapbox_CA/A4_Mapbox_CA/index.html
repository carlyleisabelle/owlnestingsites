<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="utf-8">

        <!-- Key search words -->
        <meta  name="keywords" contents="crty1033, mapbox web map, owl nesting sites, ontario owls, owl">
        
        <!-- map title -->
        <title>Owl Nesting Sites in Ontario</title>

        <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
        
        <!-- link to Google Font - Outfit -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

        <!-- link mapbox style sheet -->
        <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">

        <!-- Link mapbox geocoder style sheet -->
        <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.css" type="text/css">

        <!-- Link mapbox legend style sheet -->
        <link href='https://watergis.github.io/mapbox-gl-legend/mapbox-gl-legend.css' rel='stylesheet' />

        <!-- Link external style sheet -->
        <link rel="stylesheet" href="css/style.css">

    </head>

    <body>

    <div id="map"></div>

     <!-- load mapbox JavaScript file -->
     <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>

     <!-- Load the geocoder plugin -->
     <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.3/mapbox-gl-geocoder.min.js"></script>

    <!-- Load legend js files -->
    <script src="https://watergis.github.io/mapbox-gl-legend/mapbox-gl-legend.js"></script>

     <!-- load external js file -->
     <script src="js/script.js"></script>

    </body>

</html>
